<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Potatoes — Sleepy Cat Solver</title>
  <style>
    :root {
      --bg: #0b0d12;
      --card: #14171f;
      --border: #232835;
      --text: #eef0f6;
      --muted: #8e96a4;
      --accent: #ff9f43;
      --accent-glow: rgba(255, 159, 67, 0.25);
      --ok: #22c55e;
      --err: #ef4444;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 14px;
      background: radial-gradient(circle at top center, #181412 0%, var(--bg) 60%);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* --- Header & Winter Lofi Scene --- */
    .app-header {
      direction: ltr;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px 14px 12px;
      margin-bottom: 14px;
      background: linear-gradient(160deg, #161922 0%, #0d1016 100%);
      border: 1px solid rgba(255, 159, 67, 0.22);
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      z-index: 2;
    }

    .cat-tagline {
      margin: 0;
      font-size: 12.5px;
      font-weight: 500;
      color: #e2e8f0;
      letter-spacing: 0.2px;
    }

    .grade-badge {
      display: inline-block;
      margin-left: 3px;
      padding: 1px 7px;
      font-size: 11px;
      font-weight: 800;
      color: #1a1000;
      background: linear-gradient(135deg, #ffbe76, #ff9f43);
      border-radius: 6px;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      height: 105px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.07);
      background: #090d16;
    }

    #cozyScene {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* --- API Keys Section --- */
    .keys-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    label {
      display: block;
      color: var(--muted);
      margin: 8px 0 4px;
      font-size: 11.5px;
    }
    label:first-of-type { margin-top: 2px; }

    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f1217;
      color: var(--text);
      direction: ltr;
      text-align: left;
      font-family: Consolas, monospace;
      font-size: 12px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 159, 67, 0.15);
    }
    input:disabled { opacity: 0.55; }

    button {
      padding: 10px 14px;
      border: 0;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.12s ease, filter 0.2s ease, box-shadow 0.2s ease;
    }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    #toggleKeys {
      margin-top: 10px;
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px;
      font-size: 11.5px;
      font-weight: 600;
      border-radius: 8px;
    }
    #toggleKeys:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }

    /* --- Action Controls --- */
    .actions { display: flex; gap: 8px; margin-top: 10px; }
    #startBtn {
      flex: 2;
      background: linear-gradient(135deg, #ffbe76 0%, #ff9f43 100%);
      color: #1a1000;
      box-shadow: 0 4px 14px rgba(255, 159, 67, 0.25);
    }
    #startBtn:hover:not(:disabled) {
      filter: brightness(1.06);
      box-shadow: 0 6px 18px rgba(255, 159, 67, 0.35);
    }
    #stopBtn {
      flex: 1;
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    #stopBtn:hover:not(:disabled) {
      background: var(--err);
      color: #fff;
    }

    /* --- Status Alerts & Results Log --- */
    #status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
    }
    #status.info { display: block; background: #162033; color: #93c5fd; border: 1px solid rgba(147, 197, 253, 0.25); }
    #status.error { display: block; background: #2a1417; color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
    #status.success { display: block; background: #102619; color: #86efac; border: 1px solid rgba(34, 197, 94, 0.35); }
    #status.warn { display: block; background: #291f0e; color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.35); }

    #log { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
    .screen-title { color: var(--accent); font-size: 12px; font-weight: 600; margin-top: 4px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: rgba(255, 159, 67, 0.35); }
    .q { font-weight: 600; margin-bottom: 8px; color: #fff; }
    .row { font-size: 13px; margin-bottom: 4px; }
    .row span { color: var(--muted); }
    .final { color: var(--ok); font-weight: 700; margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--border); }
    .reason { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 1px 8px;
      border-radius: 999px;
      margin-inline-start: 6px;
    }
    .badge.agree { background: rgba(34, 197, 94, 0.15); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.3); }
    .badge.disagree { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.3); }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-top">
      <p class="cat-tagline">
        Just a sleepy cat fetching your <span class="grade-badge">A+</span>
      </p>
    </div>

    <div class="canvas-wrapper">
      <canvas id="cozyScene"></canvas>
    </div>
  </header>

  <div class="keys-box">
    <label for="geminiKey1">Solver 1 — Google Gemini API Key (يبدأ بـ AIza...)</label>
    <input id="geminiKey1" type="password" placeholder="AIza..." autocomplete="off" spellcheck="false" />

    <label for="groqKey2">Solver 2 — Groq API Key #1 (يبدأ بـ gsk_...)</label>
    <input id="groqKey2" type="password" placeholder="gsk_..." autocomplete="off" spellcheck="false" />

    <label for="groqJudgeKey3">Judge Agent 3 — Groq API Key #2 (يبدأ بـ gsk_...)</label>
    <input id="groqJudgeKey3" type="password" placeholder="gsk_..." autocomplete="off" spellcheck="false" />

    <button id="toggleKeys" type="button">إظهار المفاتيح</button>
  </div>

  <div class="actions">
    <button id="startBtn" type="button">Start Auto-Solve</button>
    <button id="stopBtn" type="button" disabled>Stop</button>
  </div>

  <div id="status"></div>
  <div id="log"></div>

  <script src="scene.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
